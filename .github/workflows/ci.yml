# This workflow will build a Java project with Maven
# For more information see: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Build and Test spring-boot-undertow

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/ci.yml'
      - '**/pom.xml'
      - 'module/**'
      - 'starter/**'
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  build-all:
    name: Compile (no tests) with JDK 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'
      - name: Print Version
        run: mvn -v
      - name: Build
        run: mvn -U -B -fae -DskipTests clean install
      - name: Tar Maven Repo
        shell: bash
        run: tar -czf maven-repo.tgz -C ~ .m2/repository
      - name: Persist Maven Repo
        uses: actions/upload-artifact@v7
        with:
          name: maven-repo
          path: maven-repo.tgz
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports-build
          path: |
            **/surefire*-reports/*.txt
            **/*.dump*

  test-matrix:
    name: JDK ${{ matrix.jdk }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-all
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        jdk: [17, 21, 25]
    steps:
      - uses: actions/checkout@v6
      - name: Download Maven Repo
        uses: actions/download-artifact@v8
        with:
          name: maven-repo
          path: .
      - name: Extract Maven Repo
        shell: bash
        run: tar -xzf maven-repo.tgz -C ~
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: 'maven'
      - name: Print Version
        run: mvn -v
      - name: Run Build
        run: mvn -U -B -fae verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports-${{ matrix.jdk }}-${{ matrix.os }}
          path: |
            **/surefire*-reports/*.txt
            **/*.dump*
