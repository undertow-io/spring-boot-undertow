# This workflow runs the Spring Boot Web Server TCK against this project.
# The TCK depends on spring-boot-web-server test-fixtures which are not
# published to Maven Central, so we clone Spring Boot and build them first.

name: Nightly TCK

on:
  schedule:
    - cron: '0 2 * * *' # Every day at 02:00 UTC
  workflow_dispatch:

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-fixtures:
    name: Build Spring Boot test fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout spring-boot-undertow
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Read Spring Boot version from POM
        id: boot-version
        shell: bash
        run: |
          # Property follows the version.<groupId> convention; fall back to the legacy name.
          VERSION=$(./mvnw -B help:evaluate -Dexpression=version.org.springframework.boot -DforceStdout -q)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null object or invalid expression" ]; then
            VERSION=$(./mvnw -B help:evaluate -Dexpression=spring-boot.version -DforceStdout -q)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Spring Boot version: ${VERSION}"

      - name: Checkout Spring Boot
        uses: actions/checkout@v6
        with:
          repository: spring-projects/spring-boot
          ref: v${{ steps.boot-version.outputs.version }}
          path: spring-boot

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Spring Boot test fixtures
        working-directory: spring-boot
        shell: bash
        run: ./gradlew :spring-boot-project:spring-boot-web-server:publishToMavenLocal :spring-boot-project:spring-boot-test-support:publishToMavenLocal

      - name: Tar test fixtures
        shell: bash
        run: |
          cd ~
          find .m2/repository/org/springframework/boot -type f | tar -czf ~/spring-boot-fixtures.tgz -T -

      - name: Upload test fixtures
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-fixtures
          path: ~/spring-boot-fixtures.tgz
          retention-days: 1

  tck:
    name: TCK - JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    needs: build-fixtures
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21, 25]
    steps:
      - name: Checkout spring-boot-undertow
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: 'maven'

      - name: Download test fixtures
        uses: actions/download-artifact@v8
        with:
          name: spring-boot-fixtures
          path: .

      - name: Extract test fixtures
        shell: bash
        run: tar -xzf spring-boot-fixtures.tgz -C ~

      - name: Run TCK
        run: ./mvnw -B verify -Ptck -pl module/undertow-spring-boot-autoconfigure

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports-tck-${{ matrix.jdk }}
          path: |
            **/surefire*-reports/*.txt
            **/*.dump*
